<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I Love BanhMi - Mockup Spec Sheets</title>
    <style>
      :root {
        --red: #ef476f;
        --sky: #7bdff2;
        --green: #9ef0cf;
        --ink: #111111;
        --muted: #52636f;
        --paper: #f7fbff;
        --card: #ffffff;
        --line: #111111;
        --soft: #eaf6ff;
        --soft-line: #d7e5ed;
        --image-bg: #e7f0f4;
        --shadow: rgba(17, 17, 17, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Arial,
          "Helvetica Neue",
          sans-serif;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px 16px;
        padding: 14px 22px;
        background: rgba(247, 251, 255, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .topbar h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .topbar span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button,
      select {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }

      button {
        padding: 0 14px;
        font-weight: 700;
        cursor: pointer;
      }

      select {
        min-width: 210px;
        padding: 0 10px;
      }

      .category-tabs {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-top: 4px;
        scrollbar-width: thin;
      }

      .tab-button {
        flex: 0 0 auto;
        height: 34px;
        padding: 0 12px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        box-shadow: 3px 3px 0 rgba(17, 17, 17, 0.18);
      }

      .tab-button[aria-selected="true"] {
        background: var(--green);
        box-shadow: 3px 3px 0 var(--ink);
      }

      main {
        display: grid;
        gap: 36px;
        padding: 28px;
      }

      .sheet {
        width: min(1500px, 100%);
        min-height: 820px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 430px;
        background: var(--paper);
        box-shadow: 0 18px 45px var(--shadow);
        overflow: hidden;
      }

      .image-pane {
        min-height: 820px;
        background: var(--image-bg);
        display: grid;
      }

      .image-pane img {
        width: 100%;
        height: 100%;
        min-height: 820px;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      .image-pane img.contain {
        object-fit: contain;
        padding: 22px;
      }

      .spec-pane {
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--paper);
      }

      .brand-head {
        min-height: 132px;
        padding: 28px 34px;
        color: var(--ink);
        border-bottom: 4px solid var(--ink);
        background: var(--green);
      }

      .brand-head h2 {
        margin: 0;
        font-size: 29px;
        line-height: 1.05;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .brand-head p {
        margin: 8px 0 0;
        font-size: 15px;
        line-height: 1.35;
      }

      .spec-body {
        display: grid;
        align-content: start;
        gap: 20px;
        padding: 28px 24px;
      }

      .price-box,
      .info-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 5px 5px 0 rgba(17, 17, 17, 0.18);
      }

      .price-box {
        padding: 20px;
      }

      .label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .price {
        margin-top: 8px;
        color: var(--red);
        font-size: 29px;
        line-height: 1.1;
        font-weight: 900;
      }

      .moq-table {
        width: 100%;
        margin-top: 14px;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
        line-height: 1.25;
      }

      .moq-table th,
      .moq-table td {
        padding: 8px 7px;
        border-top: 1px solid var(--soft-line);
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }

      .moq-table th {
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .moq-table td:nth-child(2),
      .moq-table td:nth-child(3) {
        font-weight: 800;
      }

      .moq-table td:nth-child(2) {
        color: var(--red);
      }

      .status {
        display: inline-flex;
        align-items: center;
        margin-top: 10px;
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--sky);
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
      }

      .status.dashboard {
        background: var(--green);
        color: var(--ink);
      }

      .status.official {
        background: var(--green);
        color: var(--ink);
        border: 1px solid #111111;
      }

      .info-card {
        padding: 18px 20px;
      }

      .info-card h3 {
        margin: 0 0 12px;
        font-size: 21px;
        line-height: 1.2;
      }

      .spec-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .spec-list li {
        position: relative;
        padding-left: 24px;
        color: #1f2a33;
        font-size: 15px;
        line-height: 1.35;
      }

      .spec-list li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: var(--green);
        border: 1px solid var(--ink);
      }

      .spec-list li:nth-child(3n + 1)::before {
        background: var(--sky);
      }

      .spec-list li:nth-child(3n + 2)::before {
        background: var(--red);
      }

      .note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .file-ref {
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .legacy-section {
        width: min(1500px, calc(100% - 56px));
        margin: 0 auto 48px;
        padding: 30px;
        background: #ffffff;
        box-shadow: 0 18px 45px var(--shadow);
      }

      .legacy-section h2 {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
        text-transform: uppercase;
      }

      .legacy-section > p {
        max-width: 860px;
        margin: 10px 0 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .legacy-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
        gap: 18px;
      }

      .legacy-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 5px 5px 0 rgba(17, 17, 17, 0.14);
      }

      .legacy-card header {
        padding: 16px 18px;
        background: var(--green);
        color: var(--ink);
        border-bottom: 3px solid var(--ink);
      }

      .legacy-card h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .legacy-card .source {
        margin-top: 5px;
        font-size: 11px;
        font-weight: 700;
      }

      .legacy-image-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--soft-line);
        background: var(--soft);
      }

      .legacy-image-strip figure {
        margin: 0;
        min-width: 0;
      }

      .legacy-image-strip img {
        width: 100%;
        height: 120px;
        display: block;
        object-fit: cover;
        border: 1px solid var(--soft-line);
        border-radius: 6px;
        background: var(--image-bg);
      }

      .legacy-image-strip figcaption {
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        line-height: 1.25;
      }

      .legacy-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
        line-height: 1.3;
      }

      .legacy-table th,
      .legacy-table td {
        padding: 9px 10px;
        border-top: 1px solid var(--soft-line);
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }

      .legacy-table th {
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .legacy-table td:nth-child(4) {
        color: var(--red);
        font-weight: 900;
      }

      @media (max-width: 980px) {
        .topbar {
          position: static;
          align-items: flex-start;
          grid-template-columns: 1fr;
        }

        .actions {
          width: 100%;
          align-items: stretch;
          flex-direction: column;
        }

        button,
        select {
          width: 100%;
        }

        main {
          padding: 12px;
        }

        .legacy-section {
          width: calc(100% - 24px);
          padding: 18px;
        }

        .legacy-grid {
          grid-template-columns: 1fr;
        }

        .sheet {
          min-height: 0;
          grid-template-columns: 1fr;
        }

        .image-pane,
        .image-pane img {
          min-height: 420px;
        }
      }

      @media print {
        @page {
          size: A4 landscape;
          margin: 0;
        }

        body {
          background: #ffffff;
        }

        .topbar {
          display: none;
        }

        main {
          display: block;
          padding: 0;
        }

        .legacy-section {
          width: 100vw;
          min-height: 100vh;
          margin: 0;
          box-shadow: none;
          page-break-before: always;
          break-before: page;
        }

        .sheet {
          width: 100vw;
          height: 100vh;
          min-height: 0;
          box-shadow: none;
          page-break-after: always;
          break-after: page;
          grid-template-columns: minmax(0, 1fr) 430px;
        }

        .sheet:last-child {
          page-break-after: auto;
          break-after: auto;
        }

        .image-pane,
        .image-pane img {
          min-height: 100vh;
          height: 100vh;
        }

        .spec-pane {
          height: 100vh;
        }

        .brand-head {
          min-height: 118px;
        }

        .spec-body {
          gap: 16px;
          padding: 20px;
        }

        .price {
          font-size: 25px;
        }

        .moq-table {
          font-size: 10px;
        }

        .info-card h3 {
          font-size: 18px;
        }

        .spec-list li {
          font-size: 13px;
        }
      }
    </style>
  </head>

      function renderLegacyQuotes() {
        const target = document.getElementById("legacyQuotes");
        target.innerHTML = `
          <h2>Legacy Quote Archive</h2>
          <p>Older quotation data copied into this file for reference. These legacy prices are kept separate from the current mockup spec sheets and should be re-confirmed with vendors before purchase orders.</p>
          <div class="legacy-grid">
            ${legacyQuotes
              .map(
                (group) => `
                  <article class="legacy-card">
                    <header>
                      <h3>${group.title}</h3>
                      <div class="source">Source: ${group.source}</div>
                    </header>
                    ${
                      group.images
                        ? `<div class="legacy-image-strip">
                            ${group.images
                              .map(
                                (image) => `
                                  <figure>
                                    <img src="${image.src}" alt="${image.label}">
                                    <figcaption>${image.label}</figcaption>
                                  </figure>`,
                              )
                              .join("")}
                          </div>`
                        : ""
                    }
                    <table class="legacy-table">
                      <thead>
                        <tr>
                          <th>Item</th>
                          <th>Spec</th>
                          <th>MOQ</th>
                          <th>Old quote</th>
                          <th>Note</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${group.rows
                          .map(
                            (row) => `
                              <tr>
                                <td>${row[0]}</td>
                                <td>${row[1]}</td>
                                <td>${row[2]}</td>
                                <td>${row[3]}</td>
                                <td>${row[4]}</td>
                              </tr>`,
                          )
                          .join("")}
                      </tbody>
                    </table>
                  </article>`,
              )
              .join("")}
          </div>
        `;
      }

      function renderTabs() {
        categoryTabs.innerHTML = categories
          .map((category) => {
            const count =
              category.id === "all" ? products.length : products.filter((product) => productCategory(product) === category.id).length;
            return `
              <button
                class="tab-button"
                type="button"
                data-category="${category.id}"
                aria-selected="${category.id === activeCategory}"
              >
                ${category.label} (${count})
              </button>`;
          })
          .join("");
      }

      function render() {
        const visibleProducts = products
          .map((product, index) => ({
            product,
            index,
            category: productCategory(product),
          }))
          .filter((item) => activeCategory === "all" || item.category === activeCategory);

        sheets.innerHTML = visibleProducts
          .map((item) => {
            const product = item.product;
            const id = `sheet-${item.index + 1}`;
            const tiers = getPriceTiers(product);
            const themeClass = product.theme ? ` theme-${product.theme}` : "";
            return `
              <section class="sheet${themeClass}" id="${id}" data-category="${item.category}">
                <div class="image-pane">
                  <img class="${product.fit === "contain" ? "contain" : ""}" src="${product.image}" alt="${product.title}">
                </div>
                <aside class="spec-pane">
                  <div class="brand-head">
                    <h2>${product.title}</h2>
                    <p>${product.subtitle}</p>
                  </div>
                  <div class="spec-body">
                    <div class="price-box">
                      <div class="label">MOQ pricing</div>
                      <div class="price">${product.price}</div>
                      <span class="status ${statusClass(product.status)}">${statusLabel(product.status)}</span>
                      <table class="moq-table">
                        <thead>
                          <tr>
                            <th>MOQ</th>
                            <th>Unit price</th>
                            <th>Order total</th>
                            <th>Note</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${tiers
                            .map(
                              (tier) => `
                                <tr>
                                  <td>${tier.moq}</td>
                                  <td>${tier.unit}</td>
                                  <td>${tier.total}</td>
                                  <td>${tier.note}</td>
                                </tr>`,
                            )
                            .join("")}
                        </tbody>
                      </table>
                    </div>

                    <div class="info-card">
                      <h3>Specs</h3>
                      <ul class="spec-list">
                        ${product.specs.map((item) => `<li>${item}</li>`).join("")}
                      </ul>
                    </div>

                    ${
                      product.note
                        ? `<div class="info-card"><h3>Before production</h3><div class="note">${product.note}</div></div>`
                        : ""
                    }

                    <div class="info-card">
                      <h3>Mockup file</h3>
                      <div class="file-ref">${product.image}</div>
                    </div>
                  </div>
                </aside>
              </section>`;
          })
          .join("");

        jump.innerHTML = visibleProducts
          .map((item) => `<option value="sheet-${item.index + 1}">${item.index + 1}. ${item.product.title}</option>`)
          .join("");
      }

      categoryTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        renderTabs();
        render();
        sheets.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      jump.addEventListener("change", () => {
        document.getElementById(jump.value).scrollIntoView({ behavior: "smooth", block: "start" });
      });

      renderTabs();
      render();
      renderLegacyQuotes();
    </script>
